services:
  airflow:
    build: .
    command: standalone
    user: "${UID:-1000}:0"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      PYTHONPATH: /opt/airflow
      PAPERS_DIR: /opt/airflow/library/papers
      OUTPUT_DIR: /opt/airflow/library/output
      DB_PATH: /opt/airflow/data/papers.db
      MARKDOWN_DIR: /opt/airflow/data/markdown
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - airflow-state:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - type: bind
        source: ${LIBRARY_DIR:?see LIBRARY_DIR in .env}
        target: /opt/airflow/library
    extra_hosts:
      - "host.docker.internal:host-gateway" # -> for ollama !!

volumes:
  airflow-state:
